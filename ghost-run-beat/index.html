function segIndex(b) {
  if (b < segs[0].b0) return 0;

}
function xOf(b) {
  if (b < 0) return b * PPB;

    comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);

const outLat = () => ac ? (ac.outputLatency || ac.baseLatency || 0) : 0;

const songTime = () => songTimeRaw() - calib;
function startMusic(atBeat) {
  if (master) { const m = master; try { m.gain.setTargetAtTime(0, clock(), 0.03); setTimeout(() => m.disconnect(), 400); } catch (e) {} }
  master = null;
  if (songSrc) { try { songSrc.stop(); } catch (e) {} songSrc = null; }
  if (ac) { master = ac.createGain(); master.gain.value = 0.8; master.connect(comp); }

  nextBeat = Math.ceil(atBeat - 0.001);

    songFilter.frequency.value = calibMode || previewMode ? 20000 : 900;
    songSrc = ac.createBufferSource(); songSrc.buffer = L.buffer;

}
function stopMusic() {
  if (master) { try { master.gain.setTargetAtTime(0, clock(), 0.05); } catch (e) {} } master = null;
  if (songSrc) { const sr = songSrc; setTimeout(() => { try { sr.stop(); } catch (e) {} }, 200); songSrc = null; }
}
function pumpScheduler() {
  if (!ac || !master) return;
  while (songStart + timeAt(nextBeat) < ac.currentTime + 0.2) {
    const t = songStart + timeAt(nextBeat);
    if (t >= ac.currentTime - 0.01) { try { scheduleBeat(nextBeat, t); } catch (e) {} }
    nextBeat++;

}
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
function osc(type, f, t, dur, peak) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  env(g, t, 0.004, peak, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function kick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  env(g, t, 0.002, 0.9, 0.22); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);

const hat = (t, v = 1) => noise(t, 0.035, 0.12 * v, 'highpass', 7000);

  {root: 87.31, pad: [174.61, 220, 261.63], arp: [349.23, 440, 523.25, 698.46]},

const STYLES = {

    txt('your average timing: ' + (avg >= 0 ? '+' : '') + Math.round(avg) + 'ms ' + (Math.abs(avg) > 25 ? (avg > 0 ? '(late → raise latency)' : '(early → lower latency)') : '(well calibrated)'), VW / 2, 325, '#8fa0c4', 13);
    if (newBest) txt('NEW BEST!', VW / 2 + 190, 215, '#ff7df5', 16);
    button(BTN.menu, 'MENU', '#cfd6e4');
    txt('tap anywhere else to play again', VW / 2, 395, '#4df3ff', 16);
  }
}
function drawMenu(pulse) {
  if (state === 'calib') {
    txt('CALIBRATION', VW / 2, 150, '#ffd166', 36);
    txt('Tap anywhere to the SOUND of the kick (not the visuals).', VW / 2, 200, '#cfd6e4', 16);
    txt('Use the headphones / speaker you will play with.', VW / 2, 226, '#8fa0c4', 14);
    txt(calTaps.length + ' / 12', VW / 2, 320, '#f2f5ff', 48);
    return;
  }
  if (state === 'analyzing') {
    txt('ANALYSING SONG…', VW / 2, VH / 2 - 10, '#4df3ff', 30);
    txt('finding tempo, beat grid and sections', VW / 2, VH / 2 + 24, '#8fa0c4', 14);
    return;
  }
  if (state === 'import') {
    txt('IMPORT SONG', VW / 2, 60, '#f2f5ff', 30);
    if (!imp) { txt(importErr || 'No song loaded', VW / 2, 240, '#ff3d7f', 16); button(IB.back, 'BACK', '#4df3ff'); return; }
    txt(imp.name + '  ·  ' + Math.floor(imp.an.dur / 60) + ':' + String(Math.floor(imp.an.dur % 60)).padStart(2, '0') + '  ·  detected ' + imp.an.bpm + ' BPM', VW / 2, 100, '#8fa0c4', 14);
    txt('You made it, so you know the real BPM — fix it here if detection is off.', VW / 2, 135, '#cfd6e4', 13);
    button(IB.bm1, '−1', '#cfd6e4'); button(IB.bm01, '−.1', '#cfd6e4'); button(IB.bp01, '+.1', '#cfd6e4'); button(IB.bp1, '+1', '#cfd6e4');
    txt('BPM ' + imp.bpm.toFixed(2), VW / 2, 200, '#4df3ff', 26);
    button(IB.om, '−10', '#cfd6e4'); button(IB.op, '+10', '#cfd6e4');
    txt('FIRST BEAT ' + Math.round(imp.t0 * 1000) + ' ms', VW / 2, 264, '#f2f5ff', 18);
    txt('nudge until the clicks sit exactly on the kicks', VW / 2, 282, '#8fa0c4', 11);
    button(IB.dm, '◀1', '#cfd6e4'); button(IB.dp, '1▶', '#cfd6e4');
    txt('BAR START (shift by 1 beat)', VW / 2, 334, '#f2f5ff', 18);
    txt('high click = beat 1 of the bar — should land on the strongest downbeat', VW / 2, 352, '#8fa0c4', 11);
    if (previewMode) { const ph = ((beatAt(songTime()) % 1) + 1) % 1; ctx.fillStyle = 'rgba(77,243,255,' + Math.max(0, 1 - ph * 4) + ')'; ctx.beginPath(); ctx.arc(VW / 2, 370, 8, 0, Math.PI * 2); ctx.fill(); }
    button(IB.prev, previewMode ? '■ STOP PREVIEW' : '▶ PREVIEW + CLICKS', '#ffd166');
    button(IB.gen, 'GENERATE & PLAY', '#4df3ff');
    button(IB.back, 'BACK', '#cfd6e4');
    return;
  }
  if (state === 'options') {
    txt('OPTIONS', VW / 2, 60, '#f2f5ff', 30);
    txt('PHONE CONTROLS', VW / 2, 100, '#8fa0c4', 12);
    CTRL.forEach(([id, name, sub], i) => {
      const r = ctrlBtn(i), sel = settings.controls === id;
      ctx.fillStyle = sel ? 'rgba(77,243,255,.18)' : 'rgba(255,255,255,.04)'; ctx.fillRect(r[0], r[1], r[2], r[3]);
      ctx.strokeStyle = sel ? '#4df3ff' : 'rgba(207,214,228,.35)'; ctx.lineWidth = sel ? 3 : 1; ctx.strokeRect(r[0], r[1], r[2], r[3]);
      txt(name, r[0] + r[2] / 2, r[1] + 27, sel ? '#4df3ff' : '#cfd6e4', 17);
      txt(sub, r[0] + r[2] / 2, r[1] + 48, '#8fa0c4', 11);
    });
    TOG.forEach(([id, name], i) => {
      const r = togBtn(i), on = settings[id];
      ctx.fillStyle = on ? 'rgba(125,255,154,.12)' : 'rgba(255,255,255,.04)'; ctx.fillRect(r[0], r[1], r[2], r[3]);
      ctx.strokeStyle = on ? '#7dff9a' : 'rgba(207,214,228,.35)'; ctx.lineWidth = 1; ctx.strokeRect(r[0], r[1], r[2], r[3]);
      txt(name + (on ? '  ON' : '  OFF'), r[0] + r[2] / 2, r[1] + 28, on ? '#7dff9a' : '#8fa0c4', 14);
    });
    button(BTN.minus, '−', '#cfd6e4'); button(BTN.plus, '+', '#cfd6e4');
    txt('LATENCY ' + (calib >= 0 ? '+' : '') + Math.round(calib * 1000) + ' ms', VW / 2, 327, '#f2f5ff', 18);
    button(BTN.cal, 'CALIBRATE', '#ffd166');
    txt('vibration works on Android; iPhone browsers ignore it', VW / 2, 420, 'rgba(143,160,196,.6)', 11);
    button(BTN.back, 'BACK', '#4df3ff');
    return;
  }
  txt('GHOST RUN: BEAT', VW / 2, 90, '#4df3ff', Math.round(50 + pulse * 4));
  txt('everything ON THE BEAT builds FLOW · more FLOW = more of the song', VW / 2, 125, '#8fa0c4', 14);
  txt('PICK A LEVEL', VW / 2, 172, '#cfd6e4', 13);
  LEVELS.forEach((L, i) => {
    const r = levelCard(i), sel = i === levelIdx;
    ctx.fillStyle = 'rgba(77,243,255,' + (sel ? 0.14 + pulse * 0.06 : 0.05) + ')'; ctx.fillRect(r[0], r[1], r[2], r[3]);
    ctx.strokeStyle = sel ? '#4df3ff' : 'rgba(207,214,228,.4)'; ctx.lineWidth = sel ? 3 : 1; ctx.strokeRect(r[0], r[1], r[2], r[3]);
    txt(String(i + 1), r[0] + r[2] / 2, r[1] + 58, sel ? '#4df3ff' : '#cfd6e4', 44);
    txt(L.name, r[0] + r[2] / 2, r[1] + 100, '#f2f5ff', 19);
    const bp = [...new Set((L.tempo || [[0, L.bpm]]).map(q => q[1]))].join(' → ');
    txt(bp + ' BPM' + (L.buffer ? '  ·  imported' : ''), r[0] + r[2] / 2, r[1] + 128, '#8fa0c4', 13);
    txt(bestScores[L.id] ? 'best ' + bestScores[L.id] : 'not cleared yet', r[0] + r[2] / 2, r[1] + 152, bestScores[L.id] ? '#ffd166' : 'rgba(143,160,196,.6)', 12);
    txt('▶ TAP TO PLAY', r[0] + r[2] / 2, r[1] + 184, '#4df3ff', 13);
  });
  button(DEV ? BTN.options : [VW / 2 - 120, 440, 240, 50], 'OPTIONS', '#cfd6e4');
  if (DEV) button(BTN.import, '♪ IMPORT SONG (dev)', '#ffd166');
  txt('keyboard: J slide · K jump · 1–' + LEVELS.length + ' play · O options' + (DEV ? ' · I import' : '') + ' · Esc menu', VW / 2, 528, 'rgba(143,160,196,.6)', 11);
}

// ================= LOOP =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play' || state === 'calib' || previewMode) pumpScheduler();
  if (state === 'play') update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
