<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Umbrella Man</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Georgia,serif;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;cursor:none;touch-action:none}
  #mute{position:fixed;top:10px;right:12px;font-size:26px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:10px;padding:4px 10px;touch-action:manipulation}
  @media (max-width:700px),(max-height:500px){ #say{font-size:18px!important} #end b{font-size:30px!important} #end{font-size:17px!important} }
  #hud{position:fixed;top:12px;left:14px;color:#fff;font:14px monospace;text-shadow:0 1px 2px #000;pointer-events:none;white-space:pre}
  #say{position:fixed;bottom:12%;width:100%;text-align:center;color:#fff;font-size:26px;font-style:italic;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .6s}
  #end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.75);color:#fff;font-size:22px;text-align:center}
  #end b{font-size:44px;margin-bottom:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="say"></div>
<button id="mute">🔊</button>
<div id="end"><b>You made it.</b><div id="endtxt"></div><div style="margin-top:24px;font-size:15px;opacity:.7">press R or tap to suffer again</div></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), sayEl = document.getElementById('say');
// W,H = visible world area. Small screens zoom out so you see about as much mountain as on desktop.
let W, H, ZOOM = 1, SCALE = 1;
function resize(){
  const dpr = Math.min(2, devicePixelRatio||1);
  ZOOM = Math.max(0.5, Math.min(1, Math.min(innerWidth, innerHeight)/720));
  SCALE = dpr*ZOOM;
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  W = innerWidth/ZOOM; H = innerHeight/ZOOM;
}
addEventListener('resize', resize); resize();

// ---------- tuning ----------
const G = 1500, BODYR = 24, L = 160, LMIN = 22, TIPR = 5;
const TOOLSPEED = 2400, VMAX = 1400, SUB = 8, DT = 1/120;
const ROLL = 0.988;          // office chair wheels: barely any friction
const PX_PER_M = 40;

// ---------- level: axis-aligned rects ----------
// [x, top, w, h, wet]
const P = [
  [150,-110,160,110],
  [380,-250,140,40],
  [620,-380,120,40],
  [420,-540,150,36,1],
  [180,-690,110,36],
  [-60,-850,140,36],
  [-300,-1000,120,30,1],
  [-80,-1160,90,30],
  [120,-1310,70,30],
  [300,-1460,200,24,1],
  [620,-1610,60,160],
  [800,-1760,120,30],
  [1040,-1910,100,30,1],
  [1260,-2060,80,30],
  [1100,-2210,60,30],
  [800,-2370,250,40],
];
const rects = [
  {x0:-800,x1:1700,y0:0,y1:600,ground:1},
  {x0:-1200,x1:-520,y0:-4000,y1:0,wall:1},
  {x0:1700,x1:2400,y0:-4000,y1:600,wall:1},
  ...P.map(([x,t,w,h,wet])=>({x0:x,x1:x+w,y0:t,y1:t+h,wet:!!wet})),
];
const SUMMIT = rects[rects.length-1];
const FLAG = {x: SUMMIT.x1-40, y: SUMMIT.y0};

// ---------- geometry ----------
function circleRect(px,py,r,R){
  const cx = Math.max(R.x0, Math.min(px, R.x1));
  const cy = Math.max(R.y0, Math.min(py, R.y1));
  let dx = px-cx, dy = py-cy;
  if (dx===0 && dy===0){ // centre inside: leave via nearest edge
    const dl = px-R.x0, dr = R.x1-px, dt = py-R.y0, db = R.y1-py;
    const m = Math.min(dl,dr,dt,db);
    if (m===dt) return {nx:0,ny:-1,d:dt+r};
    if (m===db) return {nx:0,ny:1,d:db+r};
    if (m===dl) return {nx:-1,ny:0,d:dl+r};
    return {nx:1,ny:0,d:dr+r};
  }
  const d = Math.hypot(dx,dy);
  if (d >= r) return null;
  return {nx:dx/d, ny:dy/d, d:r-d};
}
function pushOut(x,y,r){ // returns pushed point + whether wet, or null if free
  let hit=null;
  for (let it=0; it<3; it++){
    let any=false;
    for (const R of rects){
      const c = circleRect(x,y,r,R);
      if (c){ x+=c.nx*c.d; y+=c.ny*c.d; any=true; hit = hit||{}; if (R.wet) hit.wet=true; }
    }
    if (!any) break;
  }
  return hit ? {x,y,wet:!!hit.wet} : null;
}
function touching(x,y,r){ for (const R of rects) if (circleRect(x,y,r,R)) return true; return false; }
function clampLen(v,max,min){
  let l = Math.hypot(v.x,v.y);
  if (l < 1e-6) return {x:0,y:min};
  const t = Math.max(min, Math.min(max,l))/l;
  return {x:v.x*t, y:v.y*t};
}

// ---------- state ----------
let S;
function reset(){
  S = {
    p:{x:0,y:-BODYR-1}, v:{x:0,y:0},
    off:{x:60,y:40}, want:{x:60,y:40},
    anchor:null, grounded:false,
    t:0, started:false, won:false,
    best:0, falls:0, lastSup:0,
    cam:{x:0,y:-200},
  };
  document.getElementById('end').style.display='none';
}
reset();

// ---------- audio (all synthesized, no files) ----------
let AC=null, master, musicGain, sfxGain, noiseBuf, whistle, whistleG, muted=false;
let lastTap=0, lastThud=0, squeakAcc=0, musicBend=0;
function initAudio(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0.2; musicGain.connect(master);
  sfxGain = AC.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // falling whistle, always running, gain gated
  whistle = AC.createOscillator(); whistle.type='sine'; whistleG = AC.createGain(); whistleG.gain.value=0;
  whistle.connect(whistleG); whistleG.connect(sfxGain); whistle.start();
  startMusic();
}
function tone({f=440,f2,type='sine',t=0.15,vol=0.3,dest,when=0,detune=0,attack=0.005,vib=0,filter}){
  const t0 = AC.currentTime+when, o = AC.createOscillator(), g = AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0); o.detune.value=detune;
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0+t);
  if (vib){ const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=5.5; lg.gain.value=vib; l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0+t+.05); }
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+attack); g.gain.exponentialRampToValueAtTime(0.0001,t0+t);
  let out = o;
  if (filter){ const bq=AC.createBiquadFilter(); bq.type=filter[0]; bq.frequency.value=filter[1]; bq.Q.value=filter[2]||1; o.connect(bq); out=bq; }
  out.connect(g); g.connect(dest||sfxGain); o.start(t0); o.stop(t0+t+0.05);
}
function noise({t=0.1,vol=0.3,freq=800,q=1,type='lowpass',when=0,dest}){
  const t0 = AC.currentTime+when, s = AC.createBufferSource(), bq = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer=noiseBuf; bq.type=type; bq.frequency.value=freq; bq.Q.value=q;
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+t);
  s.connect(bq); bq.connect(g); g.connect(dest||sfxGain); s.start(t0, Math.random()*0.5); s.stop(t0+t+0.05);
}
const rnd = (a,b)=>a+Math.random()*(b-a);
function sfxTap(wet){
  if (!AC || AC.currentTime-lastTap < 0.06) return; lastTap = AC.currentTime;
  if (wet){ tone({f:rnd(380,460),f2:110,type:'sine',t:0.18,vol:0.35}); noise({t:0.12,vol:0.15,freq:2500,type:'highpass'}); }
  else { tone({f:rnd(1200,1700),type:'triangle',t:0.05,vol:0.25}); noise({t:0.03,vol:0.2,freq:3500,q:3,type:'bandpass'}); }
}
function sfxThud(s){
  if (!AC || AC.currentTime-lastThud < 0.1) return; lastThud = AC.currentTime;
  s = Math.min(1,s);
  noise({t:0.25,vol:0.5*s,freq:220}); tone({f:110,f2:38,t:0.25,vol:0.5*s});
  if (s>0.5) tone({f:rnd(600,900),f2:rnd(300,400),type:'square',t:0.12,vol:0.06,when:0.05}); // something rattles loose
}
function sfxSqueak(){ if (AC) tone({f:rnd(1700,2100),f2:rnd(2300,2900),type:'sawtooth',t:rnd(.07,.14),vol:0.04,filter:['bandpass',2400,6]}); }
function sfxTrombone(){
  if (!AC) return;
  [392,370,349].forEach((f,i)=>tone({f,type:'sawtooth',t:0.38,vol:0.18,when:0.1+i*0.38,attack:0.03,filter:['lowpass',1100]}));
  tone({f:330,f2:300,type:'sawtooth',t:1.4,vol:0.2,when:1.24,attack:0.03,vib:12,filter:['lowpass',1100]});
}
function sfxFanfare(){
  if (!AC) return;
  [0,4,7,12,11,12].forEach((s,i)=>tone({f:262*2**(s/12),type:'square',t:i===5?1.2:0.22,vol:0.12,when:i*0.18,detune:rnd(-60,60),vib:i===5?9:0}));
}
function speak(t){
  if (muted || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.rate=0.85; u.pitch=0.4; u.volume=0.9;
  speechSynthesis.speak(u);
}
function updateWhistle(){
  if (!AC) return;
  const falling = !S.anchor && !S.grounded && S.v.y > 650;
  whistleG.gain.setTargetAtTime(falling ? 0.07 : 0, AC.currentTime, 0.05);
  whistle.frequency.setTargetAtTime(Math.max(300, 2600 - S.v.y*1.4), AC.currentTime, 0.05);
  musicBend += ((falling ? -500 : 0) - musicBend) * 0.05; // music sags like a dying tape deck
}

// ---------- the music. elevator music, but broken ----------
const MEL = [
  [0,null,3,4, 7,null,6,null, 4,3,null,0, -2,null,-1,null],
  [0,null,3,4, 7,9,10,null, 9,7,6,null, 4,null,null,null],
  [12,11,null,7, 6,null,4,3, null,0,1,null, 0,null,-6,null],
];
const BASS = [[0,-5,-7,-2],[0,-5,-9,-8],[1,-4,-6,-11]];
let mStep=0, mBar=0, mNext=0;
function startMusic(){ mNext = AC.currentTime+0.3; setInterval(scheduleMusic, 25); }
function scheduleMusic(){
  while (mNext < AC.currentTime + 0.12){
    const when = mNext - AC.currentTime;
    const drift = Math.sin(AC.currentTime*0.13)*35 + Math.min(150, S.falls*6) + musicBend;
    const bar = MEL[mBar%3], bs = BASS[mBar%3];
    let n = bar[mStep];
    if (n!==null){
      if (Math.random()<0.08) n += Math.random()<0.5?1:-1;             // wrong note
      tone({f:220*2**(n/12), type:'sawtooth', t:0.26, vol:0.5, when, detune:drift+rnd(-20,20),
            attack:0.02, vib:4, filter:['bandpass',1300,3], dest:musicGain}); // kazoo-ish
    }
    if (mStep%4===0) tone({f:55*2**(bs[mStep/4]/12), type:'triangle', t:0.5, vol:0.9, when, detune:drift*0.7, dest:musicGain});
    if (mStep%2===1) noise({t:0.04, vol:0.12, freq:7000, type:'highpass', when:when+rnd(0,0.04), dest:musicGain});
    if (mStep===15 && Math.random()<0.25)                                 // occasional honk
      tone({f:rnd(90,140),f2:rnd(60,80),type:'square',t:0.6,vol:0.25,when,filter:['lowpass',600],dest:musicGain});
    mNext += 0.3 * (1 + rnd(-0.06,0.14));                                 // tempo lurches
    if (++mStep===16){ mStep=0; mBar++; if (Math.random()<0.15) mNext += 0.6; } // forgets where it is
  }
}

// ---------- input ----------
let locked=false, mouse={x:0,y:0}, touchMode=false, touchId=null, lastT={x:0,y:0};
const TOUCH_SENS = 1.4;
let speechPrimed=false;
function unlock(){
  initAudio();
  if (!speechPrimed && 'speechSynthesis' in window){ speechSynthesis.speak(new SpeechSynthesisUtterance('')); speechPrimed=true; } // iOS needs a first speak inside a tap
}
cv.addEventListener('pointerdown', e=>{
  unlock();
  if (e.pointerType==='mouse'){ touchMode=false; if(!locked) cv.requestPointerLock(); return; }
  // touch / pen: drag anywhere, finger motion nudges the umbrella (relative, like the locked mouse)
  touchMode=true; S.started=true;
  if (touchId===null){ touchId=e.pointerId; lastT={x:e.clientX,y:e.clientY}; }
});
addEventListener('pointermove', e=>{
  if (e.pointerId!==touchId) return;
  for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])){
    const dx=(ev.clientX-lastT.x)*TOUCH_SENS/ZOOM, dy=(ev.clientY-lastT.y)*TOUCH_SENS/ZOOM;
    lastT={x:ev.clientX,y:ev.clientY};
    S.want = clampLen({x:S.want.x+dx, y:S.want.y+dy}, L, LMIN);
  }
});
const endTouch = e=>{ if (e.pointerId===touchId) touchId=null; };
addEventListener('pointerup', endTouch); addEventListener('pointercancel', endTouch);
addEventListener('touchend', unlock); // iOS unlocks audio on touchend
document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false}); // no scroll / pull-to-refresh
document.addEventListener('pointerlockchange', ()=>{ locked = document.pointerLockElement===cv; });
addEventListener('mousemove', e=>{
  if (touchMode) return;
  mouse.x=e.clientX; mouse.y=e.clientY;
  if (locked){ S.want = clampLen({x:S.want.x+e.movementX, y:S.want.y+e.movementY}, L, LMIN); }
  if (!S.started && (locked || e.movementX||e.movementY)) S.started=true;
});
addEventListener('keydown', e=>{
  if (e.key==='r' && S.won) reset();
  if (e.key==='m') toggleMute();
});
function toggleMute(){
  muted=!muted; if (master) master.gain.value = muted?0:0.6;
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('mute').textContent = muted ? '🔇' : '🔊';
}
document.getElementById('mute').addEventListener('click', e=>{ e.stopPropagation(); unlock(); toggleMute(); });
document.getElementById('end').addEventListener('click', ()=>{ if (S.won && performance.now()-S.wonAt > 1500) reset(); });

// ---------- narrator ----------
const FALL_LINES = [
  "Again?","Gravity remains undefeated.","Down is also a direction.",
  "The umbrella is not a parachute.","Fascinating technique. Wrong, but fascinating.",
  "You were doing so well. Relatively.","Have you considered a desk job? Oh. Right.",
  "That chair has wheels. You knew that.","Somewhere, a physics teacher sighs.",
  "Character building, they call it.","I'd say 'try again' but you will anyway.",
  "Rain check on the summit, then.",
];
let sayT=0;
function say(t){ sayEl.textContent=t; sayEl.style.opacity=1; sayT=3.2; }
say(matchMedia('(pointer: coarse)').matches ? "Drag anywhere. Regret." : "Click. Move the mouse. Regret.");

// ---------- physics ----------
function collideBody(withVel){
  let hitAny=false;
  for (let it=0; it<3; it++){
    for (const R of rects){
      const c = circleRect(S.p.x,S.p.y,BODYR,R);
      if (!c) continue;
      hitAny=true;
      S.p.x += c.nx*c.d; S.p.y += c.ny*c.d;
      if (withVel){
        const vn = S.v.x*c.nx + S.v.y*c.ny;
        if (vn < -350) sfxThud(-vn/1400);
        if (vn < 0){ S.v.x -= vn*c.nx*1.15; S.v.y -= vn*c.ny*1.15; }  // slight bounce
        // tangential: wheels roll, wet is worse
        const tx=-c.ny, ty=c.nx, vt = S.v.x*tx+S.v.y*ty;
        const f = R.wet ? 0.998 : ROLL;
        S.v.x += tx*vt*(f-1); S.v.y += ty*vt*(f-1);
      }
    }
  }
  return hitAny;
}

function step(dt){
  if (!locked && !touchMode){ // fallback: absolute mouse relative to body on screen
    const bs = toScreen(S.p.x, S.p.y-14);
    S.want = clampLen({x:mouse.x/ZOOM-bs.x, y:mouse.y/ZOOM-bs.y}, L, LMIN);
  }
  if (!S.anchor){
    S.v.y += G*dt;
    S.p.x += S.v.x*dt; S.p.y += S.v.y*dt;
  }
  S.grounded = collideBody(!S.anchor);
  if (S.grounded && Math.abs(S.v.x) > 60){ squeakAcc += Math.abs(S.v.x)*dt; if (squeakAcc > 70){ squeakAcc=0; sfxSqueak(); } }

  // --- the umbrella ---
  const pBefore = {x:S.p.x, y:S.p.y};
  const tgt = clampLen(S.want, L, LMIN);
  let dx = tgt.x-S.off.x, dy = tgt.y-S.off.y;
  const dl = Math.hypot(dx,dy), md = TOOLSPEED*dt;
  if (dl > md){ dx*=md/dl; dy*=md/dl; }
  const sh = shoulder();
  for (let i=0;i<SUB;i++){
    const no = {x:S.off.x+dx/SUB, y:S.off.y+dy/SUB};
    const cx = S.p.x+no.x, cy = S.p.y-14+no.y;
    if (S.anchor){
      if (!touching(cx,cy,TIPR+1.5)){ S.anchor=null; S.off=no; continue; }
      if (S.anchor.wet){ const q = pushOut(cx,cy,TIPR); if(q){S.anchor.x=q.x;S.anchor.y=q.y;} }
      S.p.x = S.anchor.x-no.x; S.p.y = S.anchor.y-no.y+14;
      collideBody(false);
      S.off = clampLen({x:S.anchor.x-S.p.x, y:S.anchor.y-(S.p.y-14)}, L, LMIN);
    } else {
      const q = pushOut(cx,cy,TIPR);
      if (q){
        S.anchor = q; sfxTap(q.wet);
        S.p.x = q.x-no.x; S.p.y = q.y-no.y+14;
        collideBody(false);
        S.off = clampLen({x:q.x-S.p.x, y:q.y-(S.p.y-14)}, L, LMIN);
      } else S.off = no;
    }
  }
  if (S.anchor){
    S.v.x = (S.p.x-pBefore.x)/dt; S.v.y = (S.p.y-pBefore.y)/dt;
    // wet surfaces: the tip creeps downhill on its own
    if (S.anchor.wet) S.anchor.y += 18*dt;
  }
  const sp = Math.hypot(S.v.x,S.v.y);
  if (sp > VMAX){ S.v.x*=VMAX/sp; S.v.y*=VMAX/sp; }

  // --- bookkeeping ---
  const h = heightM();
  if (S.started && !S.won) S.t += dt;
  S.best = Math.max(S.best, h);
  if (S.grounded || S.anchor){
    if (S.lastSup - h > 7){
      S.falls++;
      const line = FALL_LINES[(Math.random()*FALL_LINES.length)|0];
      say(line + `  (−${(S.lastSup-h).toFixed(1)} m)`);
      sfxTrombone(); setTimeout(()=>speak(line), 400);
    }
    S.lastSup = h;
  }
  if (!S.won && S.grounded && S.p.x>SUMMIT.x0 && S.p.x<SUMMIT.x1 && S.p.y < SUMMIT.y0 && S.p.y > SUMMIT.y0-BODYR-6){
    S.won = true; S.wonAt = performance.now();sfxFanfare(); setTimeout(()=>speak("Oh. You actually did it. Huh."), 1300);
    document.getElementById('endtxt').innerHTML =
      `Time: ${fmt(S.t)}<br>Falls: ${S.falls}<br><br>` +
      (S.falls>20 ? "Persistence is just stubbornness with better PR." :
       S.falls>5  ? "Not bad. Not good either." : "Suspiciously competent.");
    document.getElementById('end').style.display='flex';
    document.exitPointerLock();
  }
}
const shoulder = ()=>({x:S.p.x, y:S.p.y-14});
const heightM = ()=>Math.max(0, -(S.p.y+BODYR))/PX_PER_M;
const fmt = t=>`${(t/60|0)}:${String((t%60).toFixed(1)).padStart(4,'0')}`;

// ---------- rendering ----------
function toScreen(x,y){ return {x:x-S.cam.x+W/2, y:y-S.cam.y+H/2}; }

function drawBG(){
  const k = Math.min(1, -S.cam.y/2600);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, `hsl(${30+230*k},${45-15*k}%,${70-50*k}%)`);
  g.addColorStop(1, `hsl(${25+200*k},${50-20*k}%,${82-50*k}%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // parallax hills
  for (const [f,col,amp,base] of [[0.15,'rgba(60,50,70,.35)',160,300],[0.3,'rgba(50,45,55,.45)',110,420]]){
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,H);
    for (let sx=0; sx<=W; sx+=20){
      const wx = sx + S.cam.x*f;
      const y = H/2 + base - S.cam.y*f*-1*0 + (-S.cam.y*f) - amp*(Math.sin(wx*0.004)+0.5*Math.sin(wx*0.011+1));
      ctx.lineTo(sx,y);
    }
    ctx.lineTo(W,H); ctx.fill();
  }
}
function drawRects(){
  for (const R of rects){
    const a = toScreen(R.x0,R.y0), w=R.x1-R.x0, h=R.y1-R.y0;
    if (a.x>W || a.x+w<0 || a.y>H || a.y+h<0) continue;
    ctx.fillStyle = R.wet ? '#3f6688' : R.ground ? '#5a4a3c' : R.wall ? '#3a3330' : '#6b5d50';
    ctx.beginPath(); ctx.roundRect(a.x,a.y,w,h,6); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; ctx.stroke();
    if (!R.wall){
      ctx.fillStyle = R.wet ? 'rgba(170,220,255,.7)' : '#6f8f3f';
      ctx.fillRect(a.x+3,a.y,w-6,5);
      if (R.wet){ // drips
        ctx.fillStyle='rgba(170,220,255,.6)';
        for (let x=a.x+10; x<a.x+w-6; x+=23){ const d = 4+((x*7+performance.now()/90)%9); ctx.fillRect(x,a.y+h,2,d); }
      }
    }
  }
  // flag
  const f = toScreen(FLAG.x, FLAG.y);
  ctx.strokeStyle='#ddd'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x,f.y-70); ctx.stroke();
  ctx.fillStyle='#c33'; ctx.beginPath(); ctx.moveTo(f.x,f.y-70);
  const wave = Math.sin(performance.now()/200)*5;
  ctx.lineTo(f.x+40,f.y-60+wave); ctx.lineTo(f.x,f.y-48); ctx.fill();
}
function drawMan(){
  const b = toScreen(S.p.x,S.p.y), s = toScreen(shoulder().x, shoulder().y);
  const tip = {x:s.x+S.off.x, y:s.y+S.off.y};
  ctx.save();
  // chair base + wheels
  ctx.strokeStyle='#222'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(b.x,b.y+6); ctx.lineTo(b.x,b.y+16);
  ctx.moveTo(b.x-16,b.y+18); ctx.lineTo(b.x+16,b.y+18); ctx.stroke();
  ctx.fillStyle='#111';
  for (const dx of [-16,0,16]){ ctx.beginPath(); ctx.arc(b.x+dx,b.y+20,4,0,7); ctx.fill(); }
  // seat
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.ellipse(b.x,b.y+4,20,6,0,0,7); ctx.fill();
  ctx.fillStyle='#2a2a2a'; ctx.fillRect(b.x-22,b.y-26,6,30); // backrest
  // torso
  ctx.fillStyle='#3b3f4a'; ctx.beginPath(); ctx.roundRect(b.x-12,b.y-24,24,28,5); ctx.fill();
  ctx.fillStyle='#eee'; ctx.beginPath(); ctx.moveTo(b.x-5,b.y-24); ctx.lineTo(b.x+5,b.y-24); ctx.lineTo(b.x,b.y-12); ctx.fill();
  ctx.fillStyle='#a22'; ctx.beginPath(); ctx.moveTo(b.x-2,b.y-22); ctx.lineTo(b.x+2,b.y-22); ctx.lineTo(b.x+3,b.y-6); ctx.lineTo(b.x,b.y-3); ctx.lineTo(b.x-3,b.y-6); ctx.fill();
  // head — looks at the umbrella, disapprovingly
  const look = Math.sign(S.off.x)||1;
  ctx.fillStyle='#e6c29f'; ctx.beginPath(); ctx.arc(b.x,b.y-34,10,0,7); ctx.fill();
  ctx.strokeStyle='#222'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(b.x-9,b.y-40); ctx.quadraticCurveTo(b.x+2,b.y-48,b.x+9,b.y-39); ctx.stroke();
  ctx.fillStyle='#000'; ctx.fillRect(b.x+look*3-1,b.y-36,2,2); ctx.fillRect(b.x+look*7-1,b.y-36,2,2);
  ctx.strokeStyle='#000'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(b.x+look*2,b.y-29); ctx.lineTo(b.x+look*7,b.y-30); ctx.stroke();
  // arm + umbrella
  const ang = Math.atan2(tip.y-s.y, tip.x-s.x), len = Math.hypot(tip.x-s.x, tip.y-s.y);
  ctx.translate(s.x,s.y); ctx.rotate(ang);
  ctx.strokeStyle='#3b3f4a'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(14,0); ctx.stroke();
  ctx.fillStyle='#e6c29f'; ctx.beginPath(); ctx.arc(16,0,4,0,7); ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(len,0); ctx.stroke();
  ctx.beginPath(); ctx.arc(10,5,5,-Math.PI/2,Math.PI/2,true); ctx.stroke(); // handle hook
  ctx.fillStyle = '#1d2b4a';
  ctx.beginPath(); ctx.moveTo(len*0.35,0); ctx.lineTo(len*0.62,-6); ctx.lineTo(len-6,-1.5); ctx.lineTo(len-6,1.5); ctx.lineTo(len*0.62,6); ctx.closePath(); ctx.fill();
  ctx.restore();
  if (S.anchor){ ctx.fillStyle = S.anchor.wet ? '#9cf' : '#fd6'; ctx.beginPath(); ctx.arc(tip.x,tip.y,2.5,0,7); ctx.fill(); }
}
function draw(){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  drawBG(); drawRects(); drawMan();
  hud.textContent =
    `height ${heightM().toFixed(1)} m\nbest   ${S.best.toFixed(1)} m\ntime   ${fmt(S.t)}\nfalls  ${S.falls}` +
    (touchMode ? (innerHeight>innerWidth ? '\n\n(rotate for more suffering)' : '')
               : (locked ? '' : '\n\n[click to lock mouse]') + `\n\n[M] ${muted?'unmute':'mute'}`);
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now){
  const ft = Math.min(0.1, (now-last)/1000); last = now; acc += ft;
  let n=0; while (acc >= DT && n++ < 12){ if(!S.won) step(DT); acc -= DT; }
  S.cam.x += (S.p.x - S.cam.x)*Math.min(1, ft*4);
  S.cam.y += (S.p.y - 60 - S.cam.y)*Math.min(1, ft*4);
  updateWhistle();
  if (sayT>0){ sayT-=ft; if (sayT<=0) sayEl.style.opacity=0; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
